<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Projeto Social</title>
    <link rel="stylesheet" href="estilos/styles.css" />
  </head>
  <body>
    <main>
      <section id="telefone">
        <iframe
          name="frame"
          id="tela"
          src="paginas/home.html"
          frameborder="0"
        ></iframe>
      </section>

      <section id="links">
        <!--Home page link-->
        <a href="paginas/home.html" target="frame">
          <img src="imagens/logo-home.jpg" alt="Home" /> </a
        ><br />

        <!--GitHub link-->
        <a href="paginas/github.html" target="frame">
          <img src="imagens/logo-github.jpg" alt="GitHub" /> </a
        ><br />

        <!--Linkedin link-->
        <a href="paginas/linkedin.html" target="frame">
          <img src="imagens/logo-linkedin.jpg" alt="LikedIn" /> </a
        ><br />

        <!--Instagram link-->
        <a href="paginas/instagram.html" target="frame">
          <img src="imagens/logo-instagram.jpg" alt="Instagram" /> </a
        ><br />
      </section>
    </main>
  </body>
</html>
